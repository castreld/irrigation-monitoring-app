name: irrigation_monitoring_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  fl_chart: ^1.2.0
  csv: ^8.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  video_player: ^2.11.1
  excel: ^4.0.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/splash_screen.mp4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/appicon.png"
  adaptive_icon_background: "#FCFCFC"
  adaptive_icon_foreground: "assets/appicon.png"
